<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHIR QAWI - AGI ORIGINALS VOLUME 1</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

    :root {
      --neon-cyan: #00FFFF;
      --neon-pink: #DE70A1;
      --bg-black: #080808;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-black);
      color: var(--neon-cyan);
      font-family: 'Russo One', sans-serif;
      height: 100%;
      overflow: hidden; 
    }

    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      box-sizing: border-box;
    }

    /* --- STICKY TOP SECTION --- */
    .sticky-top {
      flex-shrink: 0;
      padding: 15px;
      background: var(--bg-black);
      z-index: 10;
      border-bottom: 1px solid #1a1a1a;
      text-align: center;
    }

    .player-header { 
      margin-bottom: 12px; 
      line-height: 1.1;
    }
    
    .line-1 { font-size: 24px; letter-spacing: 4px; display: block; }
    .line-2 { font-size: 11px; letter-spacing: 1.8px; color: var(--neon-pink); display: block; margin-top: 4px; opacity: 0.9; }

    /* --- EXPAND BUTTON --- */
    .cta-container {
      margin-bottom: 15px;
    }

    .expand-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--neon-pink);
      color: var(--neon-pink);
      padding: 10px 18px;
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 4px;
      background: rgba(222, 112, 161, 0.1);
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(222, 112, 161, 0.2);
    }

    .expand-btn:hover {
      background: var(--neon-pink);
      color: #fff;
      box-shadow: 0 0 20px var(--neon-pink);
    }

    audio {
      width: 100%;
      height: 35px;
      margin-bottom: 15px;
      filter: invert(90%) hue-rotate(180deg) brightness(1.2);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 12px 0;
      font-family: 'Russo One', sans-serif;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 10px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .play-btn { background: rgba(0, 255, 255, 0.15); font-weight: bold; }
    .loop-active { border-color: var(--neon-pink) !important; color: var(--neon-pink) !important; background: rgba(222, 112, 161, 0.1) !important; }

    /* --- PLAYLIST AREA --- */
    .playlist-area {
      flex-grow: 1;
      overflow-y: auto;
      background: #0c0c0c;
    }

    .track {
      padding: 16px 20px;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .track.active { 
      background: rgba(222, 112, 161, 0.08); 
      border-left: 4px solid var(--neon-pink);
      color: var(--neon-pink);
    }

    .duration-tag { font-size: 10px; opacity: 0.5; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--neon-pink); }
  </style>
</head>
<body>

  <div class="sticky-top">
    <div class="player-header">
      <span class="line-1">SAHIR QAWI</span>
      <span class="line-2">AGI ORIGINALS VOLUME 1</span>
    </div>

    <div class="cta-container">
      <a href="https://waseemshaik26.github.io/Sahir-Qawi-Music/" target="_blank" class="expand-btn">
        📱 Mobile Users: Tap to Expand for Best Experience 🖱️
      </a>
    </div>

    <audio id="main-audio" controls controlsList="nodownload"></audio>

    <div class="controls-grid">
      <button class="nav-btn play-btn" onclick="masterPlay()">Play</button>
      <button id="loop-btn" class="nav-btn" onclick="toggleLoop()">Loop</button>
      <button class="nav-btn" onclick="prevTrack()">« Prev</button>
      <button class="nav-btn" onclick="nextTrack()">Next »</button>
    </div>
  </div>

  <div class="playlist-area" id="playlist-container"></div>

<script>
  // Volume 1 Tracks mapped from repository
  const tracks = [
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/01_Sahir%20Qawi%20Intro%20theme.mp3', title: '01. SAHIR QAWI INTRO' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/02_Altered%20states%20of%20Consiousness%20.mp3', title: '02. ALTERED STATES' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/03_Instruemtnal.mp3', title: '03. INSTRUMENTAL' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/04_Extra%20Sensory%20Perceptions.mp3', title: '04. ESP' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/05_Spectral%20frequencies%20.mp3', title: '05. SPECTRAL FREQUENCIES' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/06_Subtle%20energies%20.mp3', title: '06. SUBTLE ENERGIES' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/07_Samurai%20Percussion.mp3', title: '07. SAMURAI PERCUSSION' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/08_Shamanic%20trance.mp3', title: '08. SHAMANIC TRANCE' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/09_Esoteric%20song.mp3', title: '09. ESOTERIC SONG' },
    { url: 'https://raw.githubusercontent.com/WaseemShaik26/Sahir-Qawi-Music/main/10_Ethereal%20Beings.mp3', title: '10. ETHEREAL BEINGS' }
  ];

  let currentTrackIndex = -1;
  let isLooping = false;
  const audio = document.getElementById('main-audio');
  const playlistDiv = document.getElementById('playlist-container');
  const loopBtn = document.getElementById('loop-btn');

  function formatTime(seconds) {
    if (isNaN(seconds)) return "--:--";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return mins + ":" + (secs < 10 ? '0' : '') + secs;
  }

  function loadDurations() {
    tracks.forEach((track, index) => {
      const tempAudio = new Audio();
      tempAudio.src = track.url;
      tempAudio.addEventListener('loadedmetadata', () => {
        track.duration = formatTime(tempAudio.duration);
        buildPlaylist();
      });
    });
  }

  function buildPlaylist() {
    playlistDiv.innerHTML = '';
    tracks.forEach((track, index) => {
      const trackEl = document.createElement('div');
      trackEl.className = 'track' + (index === currentTrackIndex ? ' active' : '');
      trackEl.innerHTML = `
        <span>${track.title}</span>
        <span class="duration-tag">${index === currentTrackIndex ? 'PLAYING' : (track.duration || '...')}</span>
      `;
      trackEl.onclick = () => playTrack(index);
      playlistDiv.appendChild(trackEl);
    });
  }

  function masterPlay() {
    if (currentTrackIndex === -1) {
      playTrack(0);
    } else {
      if (audio.paused) audio.play();
      else audio.pause();
    }
  }

  function playTrack(index) {
    if (index < 0 || index >= tracks.length) return;
    currentTrackIndex = index;
    audio.src = tracks[currentTrackIndex].url;
    audio.play();
    buildPlaylist();
  }

  function nextTrack() {
    let nextIndex = (currentTrackIndex + 1) % tracks.length;
    playTrack(nextIndex);
  }

  function prevTrack() {
    let prevIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
    playTrack(prevIndex);
  }

  function toggleLoop() {
    isLooping = !isLooping;
    loopBtn.classList.toggle('loop-active', isLooping);
  }

  audio.onended = () => {
    if (isLooping) {
      audio.currentTime = 0;
      audio.play();
    } else {
      nextTrack();
    }
  };

  buildPlaylist();
  loadDurations();
</script>

</body>
</html>
